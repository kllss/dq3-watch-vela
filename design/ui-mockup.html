<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勇者斗恶龙 III · 手表版 · UI Design v0.1</title>
<style>
  :root{
    --bg:#0B0B0F;
    --panel:#16161C;
    --panel2:#1E1E26;
    --line:#2A2A33;
    --text:#F2F2F5;
    --sub:#A0A0AA;
    --gold:#E8C06A;
    --hp:#6FD08C;
    --mp:#6FA8FF;
    --danger:#FF6B6B;

    --grass:#1E3A2A;
    --tree:#1E4A2A;
    --tree-t:#7FD08C;
    --wall:#2A2A33;
    --water:#102A44;
    --water-t:#6FA8FF;
    --road:#3A3428;
    --floor:#24242C;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#F2F2F4;
    color:#1A1A1E;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .page-head{
    max-width:1000px;
    margin:0 auto;
    padding:36px 24px 8px;
  }
  .page-head h1{
    margin:0 0 6px;
    font-size:26px;
    letter-spacing:.02em;
    font-weight:700;
  }
  .page-head p{
    margin:0;
    color:#666;
    font-size:13px;
    line-height:1.6;
  }
  .controls{
    display:flex;
    gap:8px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .controls button{
    appearance:none;
    border:1px solid #D8D8DE;
    background:#fff;
    color:#333;
    border-radius:999px;
    padding:7px 14px;
    font-size:12px;
    cursor:pointer;
  }
  .controls button.on{
    background:#1A1A1E;
    color:#fff;
    border-color:#1A1A1E;
  }
  .tabs{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:12px 24px;
    margin-top:16px;
    background:rgba(242,242,244,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid #E2E2E6;
  }
  .tabs a{
    flex:0 0 auto;
    text-decoration:none;
    color:#555;
    font-size:12px;
    padding:6px 10px;
    border-radius:8px;
    border:1px solid transparent;
  }
  .tabs a:hover{
    border-color:#D8D8DE;
    background:#fff;
    color:#111;
  }

  .gallery{
    max-width:1000px;
    margin:0 auto;
    padding:34px 24px 80px;
    display:grid;
    grid-template-columns:repeat(2,448px);
    gap:44px 32px;
    justify-content:center;
  }
  @media (max-width:980px){
    .gallery{grid-template-columns:448px; padding-left:12px; padding-right:12px;}
  }

  .device{margin:0;scroll-margin-top:70px;}
  .bezel{
    position:relative;
    width:448px;
    height:530px;
    padding:8px;
    border-radius:44px;
    background:#0A0A0C;
    box-shadow:0 18px 45px rgba(0,0,0,.18), inset 0 0 0 1px #2A2A30;
  }
  .bezel::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:3px;
    width:90px;
    height:3px;
    margin-left:-45px;
    border-radius:3px;
    background:#2A2A30;
  }
  .crown{
    position:absolute;
    right:-9px;
    top:150px;
    width:9px;
    height:64px;
    border-radius:0 6px 6px 0;
    background:linear-gradient(180deg,#4A4A52,#222228);
  }
  .crown::after{
    content:"";
    position:absolute;
    left:1px;
    top:8px;
    width:2px;
    height:48px;
    border-radius:2px;
    background:rgba(255,255,255,.10);
  }

  .screen{
    position:relative;
    width:432px;
    height:514px;
    border-radius:36px;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    padding:12px;
  }
  .screen.flush{padding:0;}

  figcaption{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:12px;
    font-size:12px;
    color:#555;
    line-height:1.5;
  }
  figcaption b{color:#1A1A1E;font-weight:600;}
  figcaption span{color:#777;text-align:right;}

  /* ---------- shared ---------- */
  .topbar{
    height:44px;
    flex:0 0 44px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .topbar .center{
    flex:1;
    text-align:center;
    font-size:14px;
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .topbar .right{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--sub);
  }
  .iconbtn{
    height:36px;
    min-width:52px;
    padding:0 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    white-space:nowrap;
  }
  .iconbtn.ghost{
    background:transparent;
    border-color:transparent;
    color:var(--sub);
  }
  .gold{color:var(--gold);}
  .sub{color:var(--sub);}
  .danger{color:var(--danger);}
  .hp{color:var(--hp);}
  .mp{color:var(--mp);}

  .bar{
    height:4px;
    border-radius:4px;
    background:#24242C;
    overflow:hidden;
  }
  .bar i{
    display:block;
    height:100%;
    border-radius:4px;
    background:var(--hp);
  }
  .bar.mp i{background:var(--mp);}

  /* ---------- 01 title ---------- */
  .title-screen{
    justify-content:space-between;
    align-items:stretch;
    background:
      radial-gradient(220px 140px at 50% 28%, rgba(232,192,106,.10), transparent 70%),
      var(--bg);
  }
  .stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.55;
  }
  .stars i{
    position:absolute;
    width:2px;
    height:2px;
    background:#8A8A96;
  }
  .title-main{
    margin-top:74px;
    text-align:center;
    position:relative;
    z-index:2;
  }
  .kicker{
    font-size:10px;
    letter-spacing:.34em;
    color:var(--sub);
    margin-bottom:12px;
  }
  .title-main h2{
    margin:0;
    font-size:34px;
    line-height:1.18;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.04em;
    text-shadow:0 2px 0 rgba(0,0,0,.55);
  }
  .title-main h2 span{
    display:inline-block;
    margin-left:4px;
    padding:0 7px;
    border:1px solid rgba(232,192,106,.55);
    border-radius:6px;
    font-size:26px;
    vertical-align:2px;
  }
  .title-sub{
    margin-top:10px;
    font-size:12px;
    color:var(--sub);
    letter-spacing:.16em;
  }
  .title-menu{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:0 46px;
    margin-bottom:16px;
  }
  .big-btn{
    height:56px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    font-size:16px;
    color:var(--text);
  }
  .big-btn.primary{
    background:#2A2417;
    border-color:rgba(232,192,106,.55);
    color:var(--gold);
  }
  .big-btn.ghost{
    background:transparent;
    color:var(--sub);
  }
  .big-btn .hint{
    font-size:11px;
    color:var(--sub);
  }
  .title-foot{
    text-align:center;
    font-size:10px;
    color:#6A6A76;
    margin-bottom:18px;
    letter-spacing:.04em;
  }

  /* ---------- 02 field ---------- */
  .map{
    display:grid;
    width:396px;
    height:324px;
    margin:0 auto;
    flex:0 0 324px;
    border-radius:10px;
    overflow:hidden;
    background:#111118;
  }
  .tile{
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:1;
    user-select:none;
  }
  .tile.wall{background:var(--wall);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}
  .tile.grass{background:var(--grass);position:relative;}
  .tile.grass::after{
    content:"";
    width:2px;height:2px;border-radius:50%;
    background:rgba(255,255,255,.10);
  }
  .tile.tree{background:var(--tree);color:var(--tree-t);font-weight:700;}
  .tile.water{background:var(--water);color:var(--water-t);}
  .tile.road{background:var(--road);}
  .tile.player{
    background:var(--gold);
    color:#1A1A1E;
    font-weight:800;
    border-radius:50%;
    box-shadow:0 0 0 2px rgba(232,192,106,.25);
    transform:scale(.86);
  }
  .tile.npc{
    background:#24405C;
    color:#BFE0FF;
    font-weight:700;
    border-radius:8px;
    transform:scale(.88);
    box-shadow:inset 0 0 0 1px rgba(191,224,255,.18);
  }

  .statusbar{
    height:40px;
    flex:0 0 40px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 4px;
    font-size:11px;
    color:var(--sub);
  }
  .statusbar .cell{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
  }
  .statusbar .v{color:var(--text);font-size:12px;white-space:nowrap;}
  .statusbar .bar{width:56px;}

  .hintline{
    height:24px;
    flex:0 0 24px;
    display:flex;
    align-items:center;
    padding:0 4px;
    font-size:11px;
    color:#8A8A96;
  }
  .actionbar{
    height:56px;
    flex:0 0 56px;
    display:flex;
    gap:8px;
  }
  .actionbar .btn{
    flex:1;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    color:var(--text);
  }
  .actionbar .btn.primary{
    background:#2A2417;
    border-color:rgba(232,192,106,.45);
    color:var(--gold);
  }

  /* ---------- 03 dialog ---------- */
  .map-peek{
    position:absolute;
    left:0;
    top:0;
    width:432px;
    height:190px;
    overflow:hidden;
    opacity:.55;
  }
  .map-peek .map{
    margin:0 auto;
    border-radius:0;
    height:180px;
    flex:none;
  }
  .dim{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(11,11,15,.15) 0%,rgba(11,11,15,.72) 58%,rgba(11,11,15,.94) 100%);
  }
  .dialog-sheet{
    position:absolute;
    left:12px;
    right:12px;
    bottom:12px;
    height:306px;
    border-radius:18px;
    border:1px solid var(--line);
    background:rgba(16,16,22,.97);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .speaker{
    font-size:14px;
    color:var(--gold);
    letter-spacing:.06em;
    margin-bottom:8px;
  }
  .dialog-text{
    flex:1;
    font-size:18px;
    line-height:28px;
    letter-spacing:.02em;
    color:var(--text);
  }
  .dialog-text .dimtext{color:var(--sub);}
  .next{
    position:absolute;
    right:18px;
    bottom:88px;
    font-size:13px;
    color:var(--gold);
  }
  .choices{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .choice{
    flex:1;
    height:52px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
  }
  .choice.primary{
    background:#2A2417;
    border-color:rgba(232,192,106,.55);
    color:var(--gold);
  }

  /* ---------- 04 menu ---------- */
  .menu-grid{
    display:grid;
    grid-template-columns:repeat(2,180px);
    grid-auto-rows:96px;
    gap:12px;
    justify-content:center;
    margin-top:6px;
  }
  .menu-tile{
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .menu-tile .ico{
    font-size:20px;
    color:var(--gold);
    letter-spacing:.04em;
  }
  .menu-tile .name{font-size:16px;}
  .menu-tile .desc{font-size:10px;color:var(--sub);}
  .goal-card{
    margin-top:14px;
    border-radius:12px;
    border:1px dashed rgba(232,192,106,.30);
    background:rgba(232,192,106,.05);
    padding:10px 12px;
    font-size:11px;
    line-height:1.6;
    color:var(--sub);
  }
  .goal-card b{color:var(--gold);font-weight:600;}
  .menu-foot{
    margin-top:auto;
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--sub);
    padding:0 4px;
  }

  /* ---------- 05 status ---------- */
  .hpmp{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:4px;
  }
  .hpmp .box{
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:10px 12px;
  }
  .hpmp .lab{font-size:10px;color:var(--sub);letter-spacing:.12em;}
  .hpmp .num{font-size:22px;margin:2px 0 5px;}
  .hpmp .num small{font-size:11px;color:var(--sub);}
  .statgrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
  }
  .stat{
    border-radius:10px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:7px 10px;
  }
  .stat .k{font-size:9px;color:var(--sub);letter-spacing:.10em;}
  .stat .v{font-size:15px;margin-top:1px;}
  .equip{
    margin-top:10px;
    border-top:1px solid var(--line);
  }
  .equip-row{
    height:36px;
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .equip-row .slot{width:42px;color:var(--sub);font-size:10px;}
  .equip-row .item{flex:1;color:var(--text);}
  .equip-row .plus{color:var(--hp);font-size:11px;}
  .expbar{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:10px;
    color:var(--sub);
  }
  .expbar .bar{flex:1;height:5px;}
  .pager{
    margin-top:auto;
    display:flex;
    gap:10px;
  }
  .pager .btn{
    flex:1;
    height:52px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
  }

  /* ---------- 06 battle ---------- */
  .enemies{
    height:190px;
    flex:0 0 190px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    border-radius:12px;
    background:#101016;
    border:1px solid var(--line);
    margin-top:2px;
  }
  .enemy-card{
    width:118px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:8px;
    text-align:center;
  }
  .enemy-card .art{
    height:72px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:700;
    letter-spacing:.08em;
    color:#DFFFE8;
    background:#1B3A2A;
    margin-bottom:6px;
  }
  .enemy-card .nm{font-size:12px;}
  .enemy-card .st{font-size:10px;color:var(--sub);margin-top:2px;}
  .enemy-card.hurt .st{color:var(--gold);}
  .battle-msg{
    height:48px;
    flex:0 0 48px;
    display:flex;
    align-items:center;
    padding:0 6px;
    font-size:14px;
    color:var(--text);
  }
  .party{
    flex:0 0 144px;
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .party-row{
    height:36px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    border-bottom:1px solid rgba(42,42,51,.55);
  }
  .party-row .nm{width:46px;color:var(--text);}
  .party-row .hpnum{width:62px;text-align:right;color:var(--hp);font-size:11px;}
  .party-row .mpnum{width:48px;text-align:right;color:var(--mp);font-size:10px;}
  .party-row .bar{flex:1;height:4px;}
  .commands{
    margin-top:auto;
    display:flex;
    gap:6px;
    height:52px;
    flex:0 0 52px;
  }
  .cmd{
    flex:1;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:var(--text);
  }
  .cmd.primary{
    background:#2A2417;
    border-color:rgba(232,192,106,.50);
    color:var(--gold);
  }
  .cmd.disabled{color:#5C5C66;}

  /* ---------- 07 target ---------- */
  .target-list{
    margin-top:4px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .target-row{
    height:52px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    font-size:13px;
  }
  .target-row.sel{
    border-color:rgba(232,192,106,.75);
    background:#2A2417;
    box-shadow:0 0 0 1px rgba(232,192,106,.18) inset;
  }
  .target-row .mark{color:var(--gold);width:14px;}
  .target-row .nm{flex:1;}
  .target-row .cnt{color:var(--sub);font-size:11px;}
  .target-row .st{font-size:10px;color:var(--gold);}
  .target-hint{
    height:32px;
    display:flex;
    align-items:center;
    font-size:10px;
    color:var(--sub);
    padding:0 4px;
  }

  /* ---------- 08 shop ---------- */
  .shop-list{
    margin-top:4px;
    border-top:1px solid var(--line);
  }
  .shop-row{
    height:58px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--line);
    padding:0 6px;
  }
  .shop-row .nm{flex:1;font-size:14px;}
  .shop-row .price{font-size:13px;color:var(--gold);width:78px;text-align:right;}
  .shop-row .delta{font-size:11px;color:var(--hp);width:64px;text-align:right;}
  .shop-row.sel{
    background:#2A2417;
    border-radius:10px;
    border-bottom-color:transparent;
    box-shadow:inset 0 0 0 1px rgba(232,192,106,.45);
  }
  .shop-detail{
    margin-top:10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:9px 12px;
    font-size:11px;
    line-height:1.6;
    color:var(--sub);
  }
  .shop-detail b{color:var(--text);font-weight:600;}
  .shop-foot{
    margin-top:auto;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .shop-foot .money{flex:1;font-size:13px;color:var(--gold);}
  .shop-foot .buy{
    width:132px;height:52px;border-radius:12px;
    background:#2A2417;border:1px solid rgba(232,192,106,.55);
    color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px;
  }

  /* ---------- 09 save ---------- */
  .save-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .save-row{
    height:70px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
  }
  .save-row .slot{width:52px;font-size:10px;color:var(--sub);letter-spacing:.06em;}
  .save-row .info{flex:1;min-width:0;}
  .save-row .t1{font-size:13px;}
  .save-row .t2{font-size:10px;color:var(--sub);margin-top:3px;}
  .save-row .ok{color:var(--hp);font-size:11px;}
  .save-row.corrupt{border-color:rgba(255,107,107,.55);background:rgba(255,107,107,.06);}
  .save-row.corrupt .ok{color:var(--danger);}
  .save-note{
    margin-top:10px;
    font-size:10px;
    line-height:1.6;
    color:var(--sub);
    padding:0 4px;
  }
  .save-actions{
    margin-top:auto;

<script>
  // ---------- maps ----------
  const TILES = {
    '#': 'wall', '.': 'grass', 'T': 'tree', '~': 'water',
    ',': 'road', '@': 'player', 'K': 'npc', 'D': 'door'
  };

  const MAPS = {
    field: [
      '###########',
      '#....T....#',
      '#..T...K..#',
      '#.........#',
      '#....@....#',
      '#.........#',
      '#..~~~....#',
      '#....,....#',
      '###########'
    ],
    dialog: [
      '...........',
      '..T.....T..',
      '...........',
      '....K......',
      '...........'
    ]
  };

  function renderMap(el) {
    const rows = MAPS[el.dataset.map] || MAPS.field;
    const cols = rows[0].length;
    el.style.gridTemplateColumns = `repeat(${cols}, 36px)`;
    el.style.gridTemplateRows = `repeat(${rows.length}, 36px)`;
    el.innerHTML = '';
    for (const row of rows) {
      for (const ch of row) {
        const d = document.createElement('div');
        d.className = 'tile ' + (TILES[ch] || 'grass');
        if (ch === '@' || ch === 'K' || ch === 'T' || ch === '~') {
          d.textContent = ch;
        }
        el.appendChild(d);
      }
    }
  }
  document.querySelectorAll('[data-map]').forEach(renderMap);

  // ---------- toggles ----------
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.toggle;
      const cls = key === 'grid' ? 'grid' : key === 'notes' ? 'notes' : 'contrast';
      document.body.classList.toggle(cls);
      btn.classList.toggle('on');
    });
  });

  // ---------- lightbox ----------
  const lb = document.getElementById('lightbox');
  const lbContent = document.getElementById('lbContent');
  const lbCap = document.getElementById('lbCap');

  document.querySelectorAll('.device').forEach(device => {
    device.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      const bezel = device.querySelector('.bezel').cloneNode(true);
      const cap = device.querySelector('figcaption')?.innerText || '';
      lbContent.innerHTML = '';
      lbContent.appendChild(bezel);
      lbCap.textContent = cap;
      lb.classList.add('open');
    });
  });

  function closeLb() {
    lb.classList.remove('open');
    lbContent.innerHTML = '';
  }
  document.getElementById('lbClose').addEventListener('click', closeLb);
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLb(); });
</script>
</body>
</html>
